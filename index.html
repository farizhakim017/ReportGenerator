<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sales Report Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet"> 
</head>
<link rel="stylesheet" href="index.css">
<body>
    <h1>Sales Report Generator</h1>

    <div class="report-options">
        <button class="report-option inactive" id="eodButton">EOD Report</button>
        <button class="report-option inactive" id="2PMButton">2 PM Report</button>
        <button class="report-option inactive" id="6PMButton">6 PM Report</button>
    </div>

    <form class="form-container" id="eodForm">
        <div class="custom-dropdown">
            <label for="eodStore">Store:</label>
            <input type="text" id="eodStore" placeholder="Enter store" required>
            <ul id="storeDropdown" class="dropdown-menu">
                <li>ONE UTAMA 7930</li>
                <li>MID VALLEY 7963</li>
                <li>SUNWAY 7979</li>
                <li>PAVILION 7111</li>
            </ul>
        </div>

        <label for="eodTodaySales">Today's Sales (RM):</label>
        <input type="number" id="eodTodaySales" step="0.01" placeholder="0.00" required>

        <label for="eodLastYearSales">Last Year Sales (RM):</label>
        <input type="number" id="eodLastYearSales" step="0.01" placeholder="0.00" required>

        <label for="eodLastWeekSales">Last Week Sales (RM):</label>
        <input type="number" id="eodLastWeekSales" step="0.01" placeholder="0.00" required>

        <label for="eodAtvToday">ATV Today (RM):</label>
        <input type="number" id="eodAtvToday" step="0.01" placeholder="0.00" required>

        <label for="eodAtvLastYear">ATV Last Year (RM):</label>
        <input type="number" id="eodAtvLastYear" step="0.01" placeholder="0.00" required>

        <label for="eodAtvLastWeek">ATV Last Week (RM):</label>
        <input type="number" id="eodAtvLastWeek" step="0.01" placeholder="0.00" required>

        <label for="eodMultisTY">Multis TY:</label>
        <input type="number" id="eodMultisTY" step="0.01" placeholder="0.00" required>

        <label for="eodFoundation">Foundation:</label>
        <input type="text" id="eodFoundation" placeholder="e.g., 1:5" required>

        <label for="eodPerks">Perks (%):</label>
        <input type="number" id="eodPerks" step="0.01" placeholder="0.00" required>

        <label for="eodSignUp">Sign Up:</label>
        <input type="text" id="eodSignUp" placeholder="e.g., 1:16" required>

        <button type="submit">Generate Report</button>
    </form>

    <form class="form-container" id="2PMForm">
        <div class="custom-dropdown">
            <label for="2PMStore">Store:</label>
            <input type="text" id="2PMStore" placeholder="Enter store" required>
            <ul id="2PMStoreDropdown" class="dropdown-menu">
                <li>ONE UTAMA 7930</li>
                <li>MID VALLEY 7963</li>
                <li>SUNWAY 7979</li>
                <li>PAVILION 7111</li>
            </ul>
        </div>
        

        <label for="2PMTodaySales">Today's Sales (RM):</label>
        <input type="number" id="2PMTodaySales" step="0.01" placeholder="0.00" required>

        <label for="2PMLastYearSales">Last Year Sales (RM):</label>
        <input type="number" id="2PMLastYearSales" step="0.01" placeholder="0.00" required>

        <label for="2PMLastWeekSales">Last Week Sales (RM):</label>
        <input type="number" id="2PMLastWeekSales" step="0.01" placeholder="0.00" required>

        <label for="2PMAtvToday">ATV Today (RM):</label>
        <input type="number" id="2PMAtvToday" step="0.01" placeholder="0.00" required>

        <label for="2PMAtvLastWeek">ATV Last Week (RM):</label>
        <input type="number" id="2PMAtvLastWeek" step="0.01" placeholder="0.00" required>

        <label for="2PMAtvLastYear">ATV Last Year (RM):</label>
        <input type="number" id="2PMAtvLastYear" step="0.01" placeholder="0.00" required>

        <label for="2PMMultisTY">Multis TY:</label>
        <input type="number" id="2PMMultisTY" step="0.01" placeholder="0.00" required>

        <button type="submit">Generate Report</button>
    </form>

    <form class="form-container" id="6PMForm">
        <div class="custom-dropdown">
            <label for="6PMStore">Store:</label>
            <input type="text" id="6PMStore" placeholder="Enter store" required>
            <ul id="6PMStoreDropdown" class="dropdown-menu">
                <li>ONE UTAMA 7930</li>
                <li>MID VALLEY 7963</li>
                <li>SUNWAY 7979</li>
                <li>PAVILION 7111</li>
            </ul>
        </div>

        <label for="6PMTodaySales">Today's Sales (RM):</label>
        <input type="number" id="6PMTodaySales" step="0.01" placeholder="0.00" required>

        <label for="6PMLastYearSales">Last Year Sales (RM):</label>
        <input type="number" id="6PMLastYearSales" step="0.01" placeholder="0.00" required>

        <label for="6PMLastWeekSales">Last Week Sales (RM):</label>
        <input type="number" id="6PMLastWeekSales" step="0.01" placeholder="0.00" required>

        <label for="6PMAtvToday">ATV Today (RM):</label>
        <input type="number" id="6PMAtvToday" step="0.01" placeholder="0.00" required>

        <label for="6PMAtvLastWeek">ATV Last Week (RM):</label>
        <input type="number" id="6PMAtvLastWeek" step="0.01" placeholder="0.00" required>

        <label for="6PMAtvLastYear">ATV Last Year (RM):</label>
        <input type="number" id="6PMAtvLastYear" step="0.01" placeholder="0.00" required>

        <label for="6PMMultisTY">Multis TY:</label>
        <input type="number" id="6PMMultisTY" step="0.01" placeholder="0.00" required>

        <button type="submit">Generate Report</button>
    </form>

    <div class="result" id="result"></div>
    <button id="copyButton">Copy to Clipboard</button>

    <script src="index.js" type="module"></script>
</body>
</html>
